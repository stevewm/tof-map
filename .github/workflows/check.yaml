---
name: PR check
on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run hk checks
        run: hk check --from-ref ${{ github.event.pull_request.base.sha }} --to-ref
          ${{ github.event.pull_request.head.sha }}
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
