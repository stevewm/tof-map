---
name: PR check
on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run hk checks
        run: hk check --from-ref ${{ github.event.pull_request.base.sha }} --to-ref
          ${{ github.event.pull_request.head.sha }}
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
