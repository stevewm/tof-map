---
name: PR check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run hk checks
        run: hk check --pr
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
