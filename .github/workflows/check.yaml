---
name: PR check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run hk checks
        run: hk check --pr
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
